<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miruro TV</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div class="brand">MIRURO <span>TV</span></div><div id="status">Connecting…</div></header><main><section id="home" class="screen active"><h1>Anime</h1><div class="row"><button data-action="search" class="focusable primary">Search Anime</button><button data-action="recent" class="focusable">Recent</button><button data-action="popular" class="focusable">Popular</button></div><div id="homeGrid" class="grid"></div></section><section id="search" class="screen"><h1>Search Anime</h1><input id="query" class="focusable input" placeholder="Type anime name"><button data-action="do-search" class="focusable primary">Search</button><div id="results" class="grid"></div></section><section id="details" class="screen"><div id="detailsBox"></div><h2>Episodes</h2><div id="episodes" class="episode-grid"></div></section><section id="player" class="screen"><h1 id="playerTitle">Player</h1><div id="playerMessage" class="player-message">Select an episode.</div><video id="video" controls playsinline></video><iframe id="playerFrame" title="Anime player" allow="autoplay; fullscreen" allowfullscreen></iframe></section></main><footer><span>▲▼◀▶ Navigate</span><span>OK Select</span><span>BACK Return</span></footer></div><script src="app.js"></script></body></html>
